name: Gera EXE Windows
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed sistema_janela.py
      - uses: actions/upload-artifact@v4
        with:
          name: sistema-jantinha-WINDOWS
          path: dist/sistema_janela.exe
